name: Build DAMKAR TAPUT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Find Android Project
        shell: bash
        run: |
          echo "Mencari project Android..."
          find . -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Build APK
        shell: bash
        run: |
          if [ -f "settings.gradle" ]; then
            gradle --no-daemon assembleDebug --stacktrace
          elif [ -f "settings.gradle.kts" ]; then
            gradle --no-daemon assembleDebug --stacktrace
          elif [ -f "app/settings.gradle" ]; then
            cd app
            gradle --no-daemon assembleDebug --stacktrace
          else
            echo "ERROR: settings.gradle tidak ditemukan"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

      - name: Find APK
        shell: bash
        run: |
          echo "Mencari APK hasil build..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAMKAR-TAPUT-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error